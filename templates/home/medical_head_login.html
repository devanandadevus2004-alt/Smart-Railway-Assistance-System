<!DOCTYPE html>
<html>
<head>

    <title>Medical Head Login</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            text-align: center;
        }

        .icon {
            font-size: 50px;
        }

        h1 {
            color: #003366;
            margin-bottom: 8px;
        }

        p {
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ccd3dc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #0052cc;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #0052cc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #003d99;
        }

        .error {
            background: #ffe5e5;
            color: #c62828;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 15px;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #0052cc;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="login-box">

    <div class="icon">🚑</div>

    <h1>Medical Head Login</h1>

    <p>Access the medical assistance dashboard</p>

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            🚑 Login
        </button>

    </form>

    <a href="/" class="back">
        ← Back to Home
    </a>

</div>

</body>
</html>
